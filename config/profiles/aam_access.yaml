# 세척기(AAM) 감사추적 — MS Access (.mdb), 비밀번호 있음
#
# CWI 와 같은 Access 형식이지만 구조가 전혀 다르다.
#   CWI : 날짜별 테이블 54개 + 컬럼 9개
#   AAM : 단일 테이블 1개 + 컬럼 4개 (ID, log_time, log_name, log_description)
# 그래서 read.tables 정규식도, 질의도 따로 쓴다. 판별은 테이블 이름으로 갈린다.
#
# 이 장비의 까다로운 점
#   행위 구분이 아예 없다. 무슨 일이 있었는지가 한국어 문장 하나에만 들어있다.
#     "VACUUM BREAK 2 AUTO VALVE (이)가 ON 에서 OFF 로 변경되었습니다."
#   → 문장 형태로 갈래를 나누고(SQL), 값과 대상은 정규식으로 뽑는다(map.pattern).

id: aam_access
name: 세척기 감사추적 (Access)

detect:
  tables: ["tblAuditTrail"]

read:
  format: access
  password_key: aam_access        # 실제 값은 config/local_secrets.yaml
  tables: "^tblAuditTrail$"       # 단일 테이블
  # 판정 순서가 중요하다. '경보'를 PROCESS 보다 먼저 봐야 한다
  # — "[ DRY ] PROCESS 운전중 경보가 발생하였습니다" 는 둘 다 걸리기 때문.
  # Access 의 LIKE 와일드카드는 % 다 (* 는 안 걸린다).
  query: |
    SELECT
      [ID] AS row_id,
      [log_time] AS ts,
      [log_name] AS user_id,
      [log_description] AS message,
      IIF([log_description] LIKE '로그인%' OR [log_description] LIKE '로그아웃%', 'login',
        IIF([log_description] LIKE '%경보가 발생%', 'alarm',
          IIF([log_description] LIKE '%로 변경되었습니다%', 'value_changed',
            IIF([log_description] LIKE '%버튼을 눌렀습니다%', 'button',
              IIF([log_description] LIKE '%PROCESS%', 'process',
                IIF([log_description] LIKE '감시 프로그램%', 'system', 'door')
              )
            )
          )
        )
      ) AS action_code
    FROM [{table}]

map:
  timestamp: {column: "ts", format: "%Y-%m-%d %H:%M:%S"}
  actor:     {column: "user_id"}
  action:    {column: "action_code"}
  # 값 변경 문장이 두 갈래다. 한쪽만 잡으면 나머지가 조용히 빈칸이 된다.
  #   "VACUUM BREAK 2 AUTO VALVE (이)가 ON 에서 OFF 로 변경되었습니다."
  #   "자동 로그아웃 시간 값이  0 에서  2 (으)로 변경되었습니다."
  target:
    column: "message"
    pattern: "^(.*?)\\s*\\(이\\)가|^(.*?)\\s*값이\\s|^(.*?)\\s*버튼을|^(.*)$"
  old_value:
    column: "message"
    pattern: "(?:\\(이\\)가|값이)\\s*(.*?)\\s*에서\\s"
  new_value:
    column: "message"
    pattern: "\\s에서\\s*(.*?)\\s*(?:\\(으\\))?로\\s*변경되었습니다"

vocabulary:
  action:
    "login": login          # 로그인 / 로그아웃
    "alarm": alarm          # 운전 중 경보 발생
    "value_changed": modify # 밸브·설정값 변경 (93.9%)
    "button": operate       # 버튼 누름
    "door": operate         # 도어 OPEN/CLOSE
    "process": execute      # 공정 선택/시작/완료/강제정지
    "system": config        # 감시 프로그램 시작·종료

output:
  columns:
    - {name: "발생일시",   from: timestamp, format: "%Y-%m-%d %H:%M:%S"}
    - {name: "행위",       from: action}
    - {name: "원본구분",   from: "action_code"}
    - {name: "행위자",     from: actor}
    - {name: "대상",       from: target}
    - {name: "이전값",     from: old_value}
    - {name: "변경값",     from: new_value}
    - {name: "원본메시지", from: "message"}
    - {name: "원본파일",   from: source_name}
    - {name: "원본행번호", from: line}
